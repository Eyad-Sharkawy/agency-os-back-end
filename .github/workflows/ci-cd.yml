name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Check Formatting (Spotless)
      run: mvn spotless:check

    - name: Lint Verification (Checkstyle)
      run: mvn checkstyle:check

    - name: Run Tests & Verify Coverage (JaCoCo)
      run: mvn verify

    - name: Package JAR (Skip Tests)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: mvn clean package -DskipTests

    - name: Upload Build Artifact (JAR)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: agency-os-api-jar
        path: target/*.jar

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: SSH Deploy to Oracle Cloud Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/ubuntu/agency-os-back-end
          git pull origin main
          docker compose down
          docker compose up -d --build

