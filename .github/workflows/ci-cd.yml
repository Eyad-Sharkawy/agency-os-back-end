name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: agency_os
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Check Formatting (Spotless)
      run: mvn spotless:check

    - name: Lint Verification (Checkstyle)
      run: mvn checkstyle:check

    - name: Run Tests & Verify Coverage (JaCoCo)
      env:
        DB_URL: jdbc:postgresql://localhost:5432/agency_os
        DB_USERNAME: postgres
        DB_PASSWORD: password
        KEYCLOAK_ISSUER_URI: https://key-cloak.duckdns.org/realms/agency-os-realm
      run: mvn verify

    - name: Package JAR (Skip Tests)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: mvn clean package -DskipTests

    - name: Upload Build Artifact (JAR)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: agency-os-api-jar
        path: target/*.jar

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: SSH Deploy to Oracle Cloud Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/ubuntu/agency-os-back-end
          git pull origin main
          docker compose down
          docker compose up -d --build

