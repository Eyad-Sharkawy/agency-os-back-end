spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: agency-os-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.tenant_identifier_resolver: dev.eyadsharkawy.agencyosapi.config.TenantResolver
      hibernate.multi_tenant_connection_provider: dev.eyadsharkawy.agencyosapi.config.TenantConnectionProvider

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/default

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server:
  port: ${PORT:8080}
